<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>数据管理中心｜小谷围岛广州大学城真实生活信息共建系统</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="ops-page manage-page" onload="loadManageData()">

<div class="header">
    <div class="header-inner">
        <div>
            <h1>数据管理中心</h1>
            <p>查看、编辑、删除线索库和真实库数据</p>
        </div>
        <div class="header-actions">
            <button class="header-button" onclick="location.href='index.html'">首页</button>
            <button class="header-button" onclick="location.href='submit.html'">提交线索</button>
            <button class="header-button" onclick="location.href='map.html'">地图中心</button>
            <button class="header-button" onclick="location.href='route.html'">路线中心</button>
            <button class="header-button" onclick="location.href='history.html'">历史中心</button>
            <button class="header-button" onclick="location.href='admin.html'">审核中心</button>
            <button class="header-button" onclick="location.href='manage.html'">数据管理</button>
            <button class="header-button" onclick="location.href='crawler.html'">采集管理</button>
            <button class="header-button" onclick="location.href='dashboard.html'">数据看板</button>
            <button class="header-button" onclick="location.href='backup.html'">备份</button>
            <button class="header-button" onclick="location.href='feedback-admin.html'">反馈管理</button>
        </div>
    </div>
</div>

<div class="container ops-container">

    <div class="page-hero ops-hero manage-hero">
        <div class="hero-kicker">数据管理工作台</div>
        <h2>数据管理</h2>
        <p>管理线索、真实库、分类、来源等结构化数据，集中处理维护、编辑和清理操作。</p>
        <div class="hero-badges">
            <span class="hero-badge">数据维护</span>
            <span class="hero-badge">线索治理</span>
            <span class="hero-badge">真实库</span>
            <span class="hero-badge">管理员操作</span>
        </div>
    </div>

    <div class="box ops-panel manage-intro-panel">
        <div class="ops-panel-heading">
            <div>
                <span class="submit-section-kicker">管理说明</span>
                <h2>数据维护入口</h2>
            </div>
            <span class="status-pill status-warning">谨慎操作</span>
        </div>
        <p class="notice">
            这里用于快速清理测试数据、修改标题、分类、简介等内容。删除是真删除，测试时只删确定不要的数据。
        </p>
        <button id="manageRefreshButton" type="button" onclick="refreshManageData(this)">刷新数据</button>
    </div>

    <div id="manage-section-verified" class="section ops-panel ops-list-panel">
        <div class="manage-section-header">
            <h2>真实库数据</h2>
        </div>
        <div class="manage-section-body">
            <div id="manageVerifiedList" class="empty">正在加载真实库数据...</div>
        </div>
    </div>

    <div id="manage-section-clues" class="section ops-panel ops-list-panel">
        <div class="manage-section-header">
            <h2>线索库数据</h2>
        </div>
        <div class="manage-section-body">
            <div id="manageClueList" class="empty">正在加载线索库数据...</div>
        </div>
    </div>

</div>

<script src="manage.js?v=20260616-collapse"></script>
<script src="manage-filter.js"></script>
<script src="detail-link.js"></script>
<script src="history-auto.js?v=19"></script>
<script src="history-badge.js?v=17"></script>
<script src="global-loader.js?v=62"></script>
</body>
</html>
