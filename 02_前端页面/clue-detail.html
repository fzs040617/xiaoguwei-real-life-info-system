<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>线索详情｜小谷围岛广州大学城真实生活信息共建系统</title>
    <link rel="stylesheet" href="style.css">
</head>
<body onload="loadClueDetail(); loadFeedback('clue')">

<div class="header">
    <div class="header-inner">
        <div>
            <h1>线索详情</h1>
            <p>查看线索来源、状态、简介，并进行核验、审核和反馈补充</p>
        </div>
        <div class="header-actions">
            <button class="header-button" onclick="location.href='index.html'">首页</button>
            <button class="header-button" onclick="location.href='submit.html'">提交线索</button>
            <button class="header-button" onclick="location.href='map.html'">地图中心</button>
            <button class="header-button" onclick="location.href='route.html'">路线中心</button>
            <button class="header-button" onclick="location.href='history.html'">历史中心</button>
            <button class="header-button" onclick="location.href='admin.html'">审核中心</button>
            <button class="header-button" onclick="location.href='manage.html'">数据管理</button>
            <button class="header-button" onclick="location.href='crawler.html'">采集管理</button>
            <button class="header-button" onclick="location.href='dashboard.html'">数据看板</button>
            <button class="header-button" onclick="location.href='backup.html'">备份</button>
            <button class="header-button" onclick="location.href='feedback-admin.html'">反馈管理</button>
        </div>
    </div>
</div>

<div class="container">
    <div class="page-hero clue-detail-hero">
        <div class="hero-kicker">线索详情</div>
        <h2>线索详情</h2>
        <p>查看来源、反馈与核验信息，辅助判断是否进入真实库。</p>
        <div class="hero-badges">
            <span class="hero-badge">来源追溯</span>
            <span class="hero-badge">人工反馈</span>
            <span class="hero-badge">状态流转</span>
            <span class="hero-badge">真实库沉淀</span>
        </div>
        <div class="lifecycle-track" aria-hidden="true">
            <div class="lifecycle-step is-active">
                <span>发现</span>
                <strong>公开线索</strong>
            </div>
            <div class="lifecycle-step">
                <span>补充</span>
                <strong>用户反馈</strong>
            </div>
            <div class="lifecycle-step">
                <span>核验</span>
                <strong>人工审核</strong>
            </div>
            <div class="lifecycle-step">
                <span>沉淀</span>
                <strong>真实库</strong>
            </div>
        </div>
    </div>

    <div class="clue-detail-workbench">
        <main class="clue-detail-main">
            <div id="detailBox" class="empty">正在加载线索详情...</div>

            <div class="section clue-feedback-list-panel">
                <h2>已有反馈</h2>
                <div id="feedbackList" class="empty">正在加载反馈...</div>
            </div>
        </main>

        <aside class="clue-detail-aside" aria-label="线索详情辅助信息">
            <div class="box clue-side-card">
                <h2>操作入口</h2>
                <div class="detail-return-row">
                    <button class="small-button" onclick="location.href='admin.html'">返回审核中心</button>
                    <button class="small-button btn-secondary" onclick="location.href='index.html'">返回首页</button>
                </div>
            </div>

            <div class="box clue-side-card">
                <h2>流转路径</h2>
                <div class="clue-side-steps">
                    <div><span>1</span><strong>来源追溯</strong><em>确认平台、链接和摘要</em></div>
                    <div><span>2</span><strong>反馈沉淀</strong><em>收集纠错、过期、价格变化</em></div>
                    <div><span>3</span><strong>人工核验</strong><em>管理员判断是否可信</em></div>
                    <div><span>4</span><strong>真实库沉淀</strong><em>审核通过后同步到真实库</em></div>
                </div>
            </div>

            <div class="box clue-feedback-form-panel">
        <h2>用户反馈与补充</h2>
        <p class="notice">
            这里可以提交补充信息、纠错、过期提醒、价格变化等反馈。反馈不会直接改变真实库，需要后续审核。
        </p>

        <div class="form-row">
            <label>昵称</label>
            <input id="feedbackUserName" placeholder="可留空，默认匿名用户">
        </div>

        <div class="form-row">
            <label>反馈类型</label>
            <select id="feedbackType">
                <option value="补充信息">补充信息</option>
                <option value="真实反馈">真实反馈</option>
                <option value="纠错">纠错</option>
                <option value="已过期">已过期</option>
                <option value="价格信息">价格信息</option>
                <option value="其他">其他</option>
            </select>
        </div>

        <div class="form-row">
            <label>反馈内容</label>
            <textarea id="feedbackContent" placeholder="例如：这家店已经搬走了 / 价格涨到15元 / 我昨天去过，信息属实"></textarea>
        </div>

        <button onclick="submitFeedback('clue')">提交反馈</button>
        <div id="feedbackMessage" class="message"></div>
    </div>
        </aside>
    </div>
</div>

<script src="detail.js?v=20260616-clue-detail"></script>

<script src="submit-success-reload.js?v=12"></script>
<script src="smart-form-mode.js?v=14"></script>
<script src="smart-progress-cleanup.js?v=15"></script>
<script src="history-auto.js?v=19"></script>
<script src="history-badge.js?v=17"></script>
<script src="history-inline.js?v=18"></script>
<script src="clue-item-detail-edit.js?v=23"></script>
<script src="feedback-history-link.js?v=26"></script>
<script src="global-loader.js?v=61"></script>
</body>
</html>
