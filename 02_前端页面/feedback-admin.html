<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>反馈中心｜小谷围岛广州大学城真实生活信息共建系统</title>
    <link rel="stylesheet" href="style.css">
</head>
<body onload="loadFeedbackAdminPage()">

<div class="header">
    <div class="header-inner">
        <div>
            <h1>反馈中心</h1>
            <p>集中查看用户补充、纠错、过期提醒和真实反馈</p>
        </div>
        <div class="header-actions">
            <button class="header-button" onclick="location.href='index.html'">返回首页</button>
            <button class="header-button" onclick="location.href='admin.html'">审核中心</button>
            <button class="header-button" onclick="location.href='manage.html'">数据管理</button>
            <button class="header-button" onclick="location.href='dashboard.html'">数据看板</button>
        </div>
    </div>
</div>

<div class="container">

    <div class="box">
        <h2>反馈筛选</h2>
        <p class="notice">
            这里用于集中处理用户提交的补充、纠错、过期提醒、价格变化等反馈。
        </p>

        <div class="form-row">
            <label>关键词搜索</label>
            <input id="feedbackKeyword" placeholder="搜索反馈内容、用户名、关联标题" onkeydown="handleFeedbackSearchKeyDown(event)">
        </div>

        <div class="form-row">
            <label>对象类型</label>
            <select id="feedbackTargetType" onchange="renderFeedbackAdminList()">
                <option value="all">全部</option>
                <option value="clue">线索反馈</option>
                <option value="verified">真实库反馈</option>
            </select>
        </div>

        <div class="form-row">
            <label>反馈类型</label>
            <select id="feedbackTypeFilter" onchange="renderFeedbackAdminList()">
                <option value="all">全部类型</option>
            </select>
        </div>

        <button onclick="loadFeedbackAdminPage()">刷新反馈</button>
    </div>

    <div class="section">
        <h2>反馈统计</h2>
        <div id="feedbackStatsBox" class="empty">正在加载反馈统计...</div>
    </div>

    <div class="section">
        <h2>反馈列表</h2>
        <div id="feedbackAdminList" class="empty">正在加载反馈列表...</div>
    </div>

</div>

<script src="feedback-admin.js"></script>
<script src="history-auto.js?v=19"></script>
<script src="history-badge.js?v=17"></script>
<script src="feedback-admin-v2.js?v=24"></script>
<script src="feedback-admin-final.js?v=25"></script>
<script src="global-loader.js?v=59"></script>
</body>
</html>
