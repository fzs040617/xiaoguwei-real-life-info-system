<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>历史中心｜小谷围岛广州大学城真实生活信息共建系统</title>
    <link rel="stylesheet" href="style.css?v=40">
</head>
<body onload="loadHistoryList()">

<div class="header">
    <div class="header-inner">
        <div>
            <h1>历史中心</h1>
            <p>查看系统中线索、真实库、地图点、路线、反馈、采集目标的更新记录</p>
        </div>
        <div class="header-actions">
            <button class="header-button" onclick="location.href='index.html'">首页</button>
            <button class="header-button" onclick="location.href='submit.html'">提交线索</button>
            <button class="header-button" onclick="location.href='map.html'">地图中心</button>
            <button class="header-button" onclick="location.href='route.html'">路线中心</button>
            <button class="header-button" onclick="location.href='history.html'">历史中心</button>
            <button class="header-button" onclick="location.href='admin.html'">审核中心</button>
            <button class="header-button" onclick="location.href='manage.html'">数据管理</button>
            <button class="header-button" onclick="location.href='crawler.html'">采集管理</button>
            <button class="header-button" onclick="location.href='dashboard.html'">数据看板</button>
            <button class="header-button" onclick="location.href='backup.html'">备份</button>
            <button class="header-button" onclick="location.href='feedback-admin.html'">反馈管理</button>
        </div>
    </div>
</div>

<div class="container">

    <div class="page-hero history-hero">
        <div class="hero-kicker">更新轨迹 · 危险操作 · 可追溯</div>
        <h2>每一次线索变化，都留在这本城市生活更新簿里</h2>
        <p>查看线索、真实库、地图点、路线、反馈和采集目标的更新记录；危险清空操作保留验证码、确认文字和安全审计边界。</p>
        <div class="hero-badges">
            <span class="hero-badge">📝 更新记录</span>
            <span class="hero-badge">🔐 危险操作保护</span>
            <span class="hero-badge">📅 日期筛选</span>
            <span class="hero-badge">🧾 审计意识</span>
        </div>
        <div class="timeline-preview" aria-hidden="true">
            <div class="timeline-preview-item">
                <span class="timeline-dot status-success"></span>
                <strong>线索更新</strong>
                <em>标题、状态、来源变化</em>
            </div>
            <div class="timeline-preview-item">
                <span class="timeline-dot status-info"></span>
                <strong>反馈补充</strong>
                <em>纠错、过期提醒、价格变化</em>
            </div>
            <div class="timeline-preview-item">
                <span class="timeline-dot status-danger"></span>
                <strong>危险操作</strong>
                <em>验证码 + 确认文字 + 审计边界</em>
            </div>
        </div>
    </div>

    <div class="box">
        <h2>历史筛选</h2>

        <div class="search-box">
            <input id="historyKeyword" placeholder="搜索动作、标题、详情、操作人" onkeydown="handleHistorySearchKeyDown(event)">
            <button onclick="loadHistoryList()">搜索</button>
        </div>

        <div class="form-row">
            <label>对象类型</label>
            <select id="historyTargetType" onchange="loadHistoryList()">
                <option value="全部">全部</option>
                <option value="clue">线索</option>
                <option value="verified">真实库</option>
                <option value="map_point">地图点</option>
                <option value="route">路线</option>
                <option value="feedback">反馈</option>
                <option value="crawl_target">采集目标</option>
            </select>
        </div>
    </div>

    <div class="section">
        <h2>历史记录</h2>
        <div id="historyList" class="empty">正在加载更新历史...</div>
    </div>

</div>

<script src="history.js"></script>
<script src="history-filter-v2.js?v=17"></script>
<script src="history-danger-zone.js?v=49"></script>
<script src="global-loader.js?v=63"></script>
</body>
</html>
