<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户管理｜小谷围岛广州大学城真实生活信息共建系统</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="user-admin-page" onload="initUserAdminPage()">

<div class="header">
    <div class="header-inner">
        <div>
            <h1>用户管理</h1>
            <p>管理员查看用户列表、搜索筛选用户，并在系统密码确认后修改用户角色</p>
        </div>
        <div class="header-actions">
            <button class="header-button" onclick="location.href='index.html'">首页</button>
            <button class="header-button" onclick="location.href='submit.html'">提交线索</button>
            <button class="header-button" onclick="location.href='map.html'">地图中心</button>
            <button class="header-button" onclick="location.href='route.html'">路线中心</button>
            <button class="header-button" onclick="location.href='history.html'">历史中心</button>
            <button class="header-button" onclick="location.href='admin.html'">审核中心</button>
            <button class="header-button" onclick="location.href='manage.html'">数据管理</button>
            <button class="header-button" onclick="location.href='crawler.html'">采集管理</button>
            <button class="header-button" onclick="location.href='dashboard.html'">数据看板</button>
            <button class="header-button" onclick="location.href='backup.html'">备份</button>
            <button class="header-button" onclick="location.href='feedback-admin.html'">反馈管理</button>
        </div>
    </div>
</div>

<div class="container">
    <div class="box">
        <h2>用户筛选</h2>
        <div class="user-admin-toolbar">
            <input id="userAdminKeyword" placeholder="按用户名或昵称搜索" onkeydown="handleUserAdminSearchKey(event)">
            <select id="userAdminRoleFilter" onchange="handleUserAdminFilterChange()">
                <option value="">全部角色</option>
                <option value="admin">管理员</option>
                <option value="user">普通用户</option>
            </select>
            <select id="userAdminPageSize" onchange="handleUserAdminPageSizeChange()">
                <option value="20">每页 20 条</option>
                <option value="50">每页 50 条</option>
                <option value="100">每页 100 条</option>
            </select>
            <button onclick="searchUserAdminList()">搜索</button>
            <button class="filter-button" onclick="resetUserAdminFilters()">重置</button>
        </div>
        <div id="userAdminMessage" class="message"></div>
    </div>

    <div class="section">
        <h2>用户列表</h2>
        <div id="userAdminSummary" class="empty">正在加载用户列表...</div>
        <div id="userAdminList" class="empty">正在加载用户列表...</div>
        <div id="userAdminPagination" class="user-admin-pagination"></div>
    </div>
</div>

<div id="userRoleModalMask" class="modal-mask">
    <div class="modal">
        <div class="modal-title">
            <h2>修改用户角色</h2>
            <button class="close-button" onclick="closeUserRoleModal()">关闭</button>
        </div>

        <div class="user-role-detail" id="userRoleModalNotice"></div>

        <div class="form-row">
            <label>新角色</label>
            <select id="userRoleNewRole" onchange="updateUserRoleModalPreview()">
                <option value="user">普通用户</option>
                <option value="admin">管理员</option>
            </select>
        </div>

        <div class="form-row">
            <label>系统密码</label>
            <input id="userRoleSystemPassword" type="password" placeholder="请输入系统密码">
        </div>

        <div class="form-row">
            <label>确认文字</label>
            <input id="userRoleConfirmText" placeholder="请输入：修改角色">
        </div>

        <div class="form-row">
            <label>动态验证码</label>
            <div class="xgw-verify-code-panel">
                <span class="tag">验证码</span>
                <strong id="userRoleVerifyDisplay" class="xgw-verify-code" onclick="loadUserRoleVerifyCode()" title="点击刷新验证码">点击获取</strong>
                <button type="button" class="small-button filter-button" onclick="loadUserRoleVerifyCode()">刷新</button>
            </div>
            <input id="userRoleVerifyCode" placeholder="请输入上方动态验证码">
        </div>

        <div id="userRoleModalMessage" class="message"></div>

        <div class="action-row">
            <button class="danger-button" onclick="submitUserRoleChange()">确认修改角色</button>
            <button class="filter-button" onclick="closeUserRoleModal()">取消</button>
        </div>
    </div>
</div>

<script src="user-admin.js?v=2"></script>
<script src="global-loader.js?v=62"></script>
</body>
</html>
