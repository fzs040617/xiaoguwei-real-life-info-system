<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>外部平台采集管理｜小谷围岛广州大学城真实生活信息共建系统</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="collector-page" onload="initCollectorPage()">

<div class="header">
    <div class="header-inner">
        <div>
            <h1>外部平台采集管理</h1>
            <p>配置公开 RSS、公开 API、公开 HTML 列表页的每日采集</p>
        </div>
        <div class="header-actions">
            <button class="header-button" onclick="location.href='index.html'">首页</button>
            <button class="header-button" onclick="location.href='submit.html'">提交线索</button>
            <button class="header-button" onclick="location.href='map.html'">地图中心</button>
            <button class="header-button" onclick="location.href='route.html'">路线中心</button>
            <button class="header-button" onclick="location.href='history.html'">历史中心</button>
            <button class="header-button" onclick="location.href='admin.html'">审核中心</button>
            <button class="header-button" onclick="location.href='manage.html'">数据管理</button>
            <button class="header-button" onclick="location.href='crawler.html'">采集管理</button>
            <button class="header-button" onclick="location.href='dashboard.html'">数据看板</button>
            <button class="header-button" onclick="location.href='backup.html'">备份</button>
            <button class="header-button" onclick="location.href='feedback-admin.html'">反馈管理</button>
        </div>
    </div>
</div>

<div class="container">
    <div class="box">
        <p class="notice">
            第一版只支持公开可访问的数据源，不处理登录、验证码、私密内容、付费墙或需要特殊授权的接口。
            不要填写平台账号、cookie、token、密钥。
        </p>

        <div class="collector-form-grid">
            <div class="form-row">
                <label>名称</label>
                <input id="collectorName" placeholder="例如：大学城公开资讯 RSS">
            </div>
            <div class="form-row">
                <label>平台</label>
                <input id="collectorPlatform" placeholder="例如：公开网站、学校公告、RSS">
            </div>
            <div class="form-row">
                <label>类型</label>
                <select id="collectorType">
                    <option value="rss">rss / atom</option>
                    <option value="api">公开 JSON API</option>
                    <option value="public_html">公开 HTML 列表页</option>
                </select>
            </div>
            <div class="form-row">
                <label>是否启用</label>
                <select id="collectorEnabled">
                    <option value="true">启用</option>
                    <option value="false">停用</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <label>URL</label>
            <div class="collector-url-row">
                <input id="collectorUrl" placeholder="仅填写公开可访问的 RSS、JSON API 或 HTML 列表页 URL">
                <button type="button" onclick="detectCollectorSource()">智能识别</button>
            </div>
            <div id="collectorDetectMessage" class="message collector-detect-message"></div>
        </div>

        <div class="form-row">
            <label>关键词</label>
            <input id="collectorKeyword" placeholder="多个关键词用逗号分隔；留空时使用大学城相关默认关键词">
        </div>

        <div class="form-row">
            <label>备注</label>
            <textarea id="collectorNotes" placeholder="说明来源用途、公开性和人工确认情况"></textarea>
        </div>

        <button onclick="submitCollectorSource()">新增采集源</button>
        <button style="margin-left: 8px;" onclick="runAllCollectorSources()">运行全部启用源</button>

        <div id="collectorMessage" class="message"></div>
    </div>

    <div class="section">
        <h2>采集源列表</h2>
        <div id="collectorSourceList" class="empty">正在加载采集源...</div>
    </div>

    <div class="section">
        <h2>采集条目</h2>
        <div class="collector-toolbar">
            <input id="collectorItemKeyword" placeholder="按标题、摘要或链接搜索">
            <select id="collectorItemStatus">
                <option value="">全部状态</option>
                <option value="new">new</option>
                <option value="reviewed">reviewed</option>
                <option value="ignored">ignored</option>
            </select>
            <button onclick="loadCollectorItems()">筛选</button>
        </div>
        <div id="collectorItemList" class="empty">正在加载采集条目...</div>
    </div>

    <div class="section">
        <h2>运行日志</h2>
        <div id="collectorRunList" class="empty">正在加载运行日志...</div>
    </div>
</div>

<script src="app.js?v=9"></script>
<script src="crawler-collector.js?v=1"></script>
<script src="global-loader.js?v=61"></script>
</body>
</html>
