<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>路线详情｜小谷围岛广州大学城真实生活信息共建系统</title>
    <link rel="stylesheet" href="style.css">
</head>
<body onload="loadRouteDetailPage()">

<div class="header">
    <div class="header-inner">
        <div>
            <h1>路线详情</h1>
            <p>查看路线说明、包含的地图点和独立更新历史</p>
        </div>
        <div class="header-actions">
            <button class="header-button" onclick="location.href='index.html'">首页</button>
            <button class="header-button" onclick="location.href='submit.html'">提交线索</button>
            <button class="header-button" onclick="location.href='map.html'">地图中心</button>
            <button class="header-button" onclick="location.href='route.html'">路线中心</button>
            <button class="header-button" onclick="location.href='history.html'">历史中心</button>
            <button class="header-button" onclick="location.href='admin.html'">审核中心</button>
            <button class="header-button" onclick="location.href='manage.html'">数据管理</button>
            <button class="header-button" onclick="location.href='crawler.html'">采集管理</button>
            <button class="header-button" onclick="location.href='dashboard.html'">数据看板</button>
            <button class="header-button" onclick="location.href='backup.html'">备份</button>
            <button class="header-button" onclick="location.href='feedback-admin.html'">反馈管理</button>
        </div>
    </div>
</div>

<div class="container">
    <div id="detailBox" class="empty">正在加载路线详情...</div>

    <div class="section">
        <h2>该路线的更新历史</h2>
        <div id="detailHistorySummary" class="card">正在加载最后更新时间...</div>
        <div id="detailHistoryList" class="empty">正在加载更新历史...</div>
    </div>
</div>

<script src="map-route-detail.js?v=21"></script>
<script>
async function loadRouteDetailPage() {
    await loadRouteDetail();
    await loadRouteSpatialRelations();
}

async function loadRouteSpatialRelations() {
    const id = new URLSearchParams(window.location.search).get("id");
    const detailBox = document.getElementById("detailBox");
    const detailCard = detailBox ? detailBox.querySelector(".card") : null;
    if (!id || !detailCard || document.getElementById("routeSpatialRelations")) {
        return;
    }

    try {
        const [response, pointResponse] = await Promise.all([
            fetch(`http://127.0.0.1:8000/routes/${encodeURIComponent(id)}`),
            fetch("http://127.0.0.1:8000/map-points")
        ]);
        const route = await response.json();
        const pointData = await pointResponse.json();
        if (!response.ok) {
            return;
        }
        const pointHtml = buildRouteDetailPointLinks(route, pointResponse.ok ? (pointData.data || []) : []);
        detailCard.insertAdjacentHTML("beforeend", `
            <div id="routeSpatialRelations" class="spatial-link-panel spatial-detail-panel">
                <div>
                    <strong>途经地图点</strong>
                    <span>优先显示可查到的地图点名称和地址；缺失时保留 ID。</span>
                </div>
                ${pointHtml || "<p>当前路线暂未绑定地图点。</p>"}
            </div>
        `);
    } catch (error) {
        // 关联增强失败不影响原详情页。
    }
}

function buildRouteDetailPointLinks(route, allMapPoints) {
    const pointItems = buildRouteDetailPointItems(route, allMapPoints);
    const duplicateNote = hasSameNameDifferentIds(pointItems)
        ? `<div class="scene-duplicate-note">存在同名地点，请根据地图点 ID 区分；如为误建，可后续在地图中心清理重复地点。</div>`
        : "";
    return `${duplicateNote}${pointItems.map(point => `
        <div class="spatial-linked-item scene-linked-point-card">
            <div class="scene-linked-point-head">
                <strong>地图点 #${Number(point.id)} · ${escapeDetailHtml(point.name || "未命名地图点")}</strong>
                <span class="scene-id-badge">#${Number(point.id)}</span>
            </div>
            <div class="scene-point-meta">
                <span>ID：${Number(point.id)}</span>
                <span>分类：${escapeDetailHtml(point.category || "未分类")}</span>
                <span>地址：${escapeDetailHtml(point.address || "暂无地址/区域")}</span>
                <span>来源：${escapeDetailHtml(point.source || "未知来源")}</span>
            </div>
            ${point.missing ? `<p>未找到对应地图点，可能已删除或尚未创建。</p>` : ""}
            <button class="small-button" onclick="location.href='map-detail.html?id=${Number(point.id)}'">${point.missing ? "尝试打开地图点详情" : "查看地图点详情"} #${Number(point.id)}</button>
        </div>
    `).join("")}`;
}

function buildRouteDetailPointItems(route, allMapPoints) {
    const byId = new Map();
    (allMapPoints || []).forEach(point => {
        const id = Number(point && point.id);
        if (id) {
            byId.set(id, point);
        }
    });
    const routePointMap = new Map();
    (route.points || []).forEach(point => {
        const id = Number(point && point.id);
        if (id && !routePointMap.has(id)) {
            routePointMap.set(id, {...(byId.get(id) || {}), ...point});
        }
    });

    parseRouteDetailPointIds(route.point_ids).forEach(id => {
        if (!routePointMap.has(id)) {
            routePointMap.set(id, byId.get(id) || {id, missing: true});
        }
    });
    return Array.from(routePointMap.values()).map(point => ({
        id: Number(point.id),
        name: point.name || "",
        category: point.category || "",
        address: point.address || "",
        source: point.source || "",
        missing: Boolean(point.missing)
    }));
}

function hasSameNameDifferentIds(points) {
    const nameToIds = new Map();
    points.forEach(point => {
        const name = String(point.name || "").trim();
        if (!name) {
            return;
        }
        if (!nameToIds.has(name)) {
            nameToIds.set(name, new Set());
        }
        nameToIds.get(name).add(Number(point.id));
    });
    return Array.from(nameToIds.values()).some(ids => ids.size > 1);
}

function parseRouteDetailPointIds(value) {
    if (!value) {
        return [];
    }
    if (Array.isArray(value)) {
        return uniqueRouteDetailPointIds(value);
    }
    const text = String(value || "").trim();
    if (!text) {
        return [];
    }
    try {
        const parsed = JSON.parse(text);
        if (Array.isArray(parsed)) {
            return uniqueRouteDetailPointIds(parsed);
        }
    } catch (error) {
        // Fall through.
    }
    return uniqueRouteDetailPointIds(text.replace(/[，、;；\s]+/g, ",").split(","));
}

function uniqueRouteDetailPointIds(values) {
    const seen = new Set();
    const result = [];
    values.forEach(value => {
        const id = Number(String(value || "").trim());
        if (Number.isInteger(id) && id > 0 && !seen.has(id)) {
            seen.add(id);
            result.push(id);
        }
    });
    return result;
}
</script>
<script src="history-auto.js?v=21"></script>
<script src="map-route-detail-edit.js?v=22"></script>
<script src="map-route-feedback.js?v=24"></script>

</body>
</html>
